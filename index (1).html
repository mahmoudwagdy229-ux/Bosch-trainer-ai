function setCategory(c){category=c;series='all';favOnly=false;['cooker','dw','fridge'].forEach(x=>document.getElementById(x+'Btn').classList.toggle('active',x===c));document.getElementById('favFilter').classList.remove('active');buildFilters();renderList()}
function buildFilters(){let ss=[...new Set(Object.values(data[category]).map(m=>m.series))].sort((a,b)=>b-a);document.getElementById('filters').innerHTML=['all',...ss].map(x=>`<button class="chip ${series===x?'active':''}" onclick="setSeries('${x}')">${x==='all'?'كل السلاسل':'Series '+x}</button>`).join('')}
function setSeries(s){series=s==='all'?'all':Number(s);buildFilters();renderList()}function toggleFavFilter(){favOnly=!favOnly;document.getElementById('favFilter').classList.toggle('active',favOnly);renderList()}function clearSearch(){document.getElementById('search').value='';renderList()}
function searchable(n,m){return n+' '+m.series+' '+(m.features||[]).join(' ')+' '+(m.capacity||'')+' '+(m.kind||'')+' '+(m.gas||'')+' '+(m.people||'')+' '+(m.dimensions||'')}
function renderList(){let q=norm(document.getElementById('search').value),entries=[];if(q){Object.entries(data).forEach(([c,models])=>Object.entries(models).forEach(([n,m])=>{if(norm(searchable(n,m)).includes(q))entries.push([c,n,m])}))}else entries=Object.entries(data[category]).map(([n,m])=>[category,n,m]).filter(([c,n,m])=>(series==='all'||m.series===series)&&(!favOnly||favorites.includes(key(c,n))));document.getElementById('clear').style.display=q?'block':'none';document.getElementById('count').textContent=entries.length;document.getElementById('list').innerHTML=entries.length?entries.map(([c,n,m])=>row(c,n,m)).join(''):'<div class="empty">لا توجد نتائج. جرّب رقم موديل أو ميزة مختلفة.</div>'}

function toggleFav(c,n){let k=key(c,n),i=favorites.indexOf(k);i<0?favorites.push(k):favorites.splice(i,1);store.set('boschFav',favorites);renderList();notify(i<0?'تمت الإضافة للمفضلة':'تمت الإزالة من المفضلة')}
const benefitMap={'Vario Inverter':'يضبط سرعة الكومبريسور حسب الحاجة لتوفير الطاقة والحفاظ على ثبات التبريد وتقليل الضوضاء.','VitaFresh Plus':'تحكم في الرطوبة يساعد على الحفاظ على الفاكهة والخضروات طازجة لمدة تصل إلى 21 يوم.','VitaFresh':'تحكم في الرطوبة يساعد على الحفاظ على الفاكهة والخضروات طازجة لمدة تصل إلى 14 يوم.','FreshSense':'مستشعرات تراقب الحرارة وتضبط التبريد تلقائيًا للحفاظ على درجة حرارة ثابتة.','Multi Air Flow':'يوزع الهواء البارد بالتساوي داخل أجزاء الثلاجة.','Home Connect':'متابعة وتحكم في وظائف الجهاز من خلال التطبيق.','Perfect Fit':'يسمح باستخدام الأدراج حتى عند وضع الجهاز بجوار الحائط بزاوية 90 درجة.','Flex Cool & Freeze':'إمكانية تحويل منطقة الفريزر إلى ثلاجة حسب الحاجة.','تنظيف حفزي':'يساعد على تقليل مجهود تنظيف الدهون داخل الفرن.','Hybrid Cooking':'يساعد على تسخين الفرن أسرع وتوفير الوقت.','Dual Control Wok':'تحكم أدق في الشعلة الكبيرة على أربعة مستويات.','AquaStop':'حماية إضافية تساعد على إيقاف الغسالة عند اكتشاف تسرب.','Zeolith Drying':'يحوّل الرطوبة إلى حرارة للمساعدة في تجفيف الأطباق والبلاستيك.','Efficient Dry':'فتح تلقائي للباب بعد البرنامج لتحسين التجفيف وتوفير الطاقة.','Power Control':'تخصيص ضغط المياه في السلة السفلية حسب درجة الاتساخ.'};function benefit(f){return benefitMap[f]||'ميزة تساعد على تحسين سهولة الاستخدام وتجربة العميل حسب احتياجه.'}
function summary(c,n,m){if(c==='cooker')return `بوتاجاز Bosch Series ${m.series} بسعة فرن 147 لتر مناسب للعائلات التي تحتاج مساحة ومرونة في الطهي.`;if(c==='dw')return `غسالة أطباق Bosch Series ${m.series} بسعة ${m.people} فرد و${m.racks} أرفف للاستخدام العائلي المنظم.`;return `${m.kind} Bosch Series ${m.series} بسعة ${m.capacity} لتر، مناسبة لمن يبحث عن تبريد منظم ومساحة تخزين عملية.`}
function specs(c,m){if(c==='cooker')return [['الفئة','بوتاجاز غاز حر'],['السلسلة','Series '+m.series],['سعة الفرن','147 لتر'],['مدخل الغاز',m.gas],['الضمان','5 سنوات شامل']];if(c==='dw')return [['الفئة',m.features.includes('Built-in')?'غسالة Built-in':'غسالة قائمة بذاتها'],['السلسلة','Series '+m.series],['السعة',m.people+' فرد'],['عدد الأرفف',m.racks],['الضمان','10 سنوات للموتور و5 شامل']];return [['الفئة',m.kind],['السلسلة','Series '+m.series],['السعة',m.capacity+' لتر'],['الأبعاد',m.dimensions],['حفظ الخضروات والفاكهة',m.fresh],['الضمان','10 سنوات للكومبريسور و5 سنوات شامل']]}
function discovery(c){if(c==='cooker')return ['كم مرة تستخدم الفرن أسبوعيًا؟','هل تحضّر أكثر من صنف في الوقت نفسه؟','ما الأهم: سرعة التسخين أم سهولة التنظيف؟'];if(c==='dw')return ['كم عدد أفراد الأسرة؟','هل توجد حلل شديدة الاتساخ أو بلاستيك كثير؟','ما الأهم: التجفيف أم المرونة أم التحكم الذكي؟'];return ['كم عدد أفراد الأسرة وما حجم التخزين المطلوب؟','هل تشتري خضروات وفاكهة بكميات كبيرة؟','هل الأولوية لتوفير الطاقة أم السعة أم Home Connect؟']}
function sales(c,n,m){if(c==='cooker')return `موديل ${n} يوفر فرن 147 لتر مع ${m.features.slice(0,3).join('، ')} لتجربة طهي عملية وآمنة.`;if(c==='dw')return `غسالة Bosch ${n} تستوعب ${m.people} فرد وتقدم ${m.features.slice(0,3).join('، ')} لتنظيف مرن وعملي.`;return `ثلاجة Bosch ${n} بسعة ${m.capacity} لتر من Series ${m.series} وتقدم ${m.features.slice(0,3).join('، ')} لتخزين منظم والحفاظ على الطعام.`}
function openDetail(c,n){let m=data[c][n];document.getElementById('catalog').style.display='none';document.getElementById('compare').classList.remove('open');let sp=specs(c,m).slice(2,4).map(x=>`<div class="spec"><small>${x[0]}</small><b>${x[1]}</b></div>`).join('');document.getElementById('detail').innerHTML=`<button class="back" onclick="backHome()">→ رجوع للموديلات</button><div class="card product-hero"><div class="head"><div><div class="eyebrow">${labels[c]} · SERIES ${m.series}</div><div class="hero-model">${n}</div></div><button class="star ${favorites.includes(key(c,n))?'on':''}" onclick="toggleFav('${c}','${n}');openDetail('${c}','${n}')">★</button></div><div class="value">${summary(c,n,m)}</div><div class="badges"><span class="badge">Series ${m.series}</span><span class="badge">${m.features.length} مميزات</span><span class="badge">5 سنوات ضمان شامل</span></div><div class="specs">${sp}</div></div><div class="tabs"><button class="active" onclick="showTab('overview','${c}','${n}',this)">نظرة عامة</button><button onclick="showTab('specs','${c}','${n}',this)">المواصفات</button><button onclick="showTab('benefits','${c}','${n}',this)">المميزات والفوائد</button><button onclick="showTab('sales','${c}','${n}',this)">Sales Talk</button><button onclick="showTab('discovery','${c}','${n}',this)">اكتشاف الاحتياج</button></div><div id="panel"></div><div class="actions"><button class="primary" onclick="copyModel('${c}','${n}')">نسخ البيانات</button><button class="secondary" onclick="addCompare('${c}','${n}')">إضافة للمقارنة</button></div>`;document.getElementById('detail').classList.add('open');showTab('overview',c,n);scrollTo(0,0)}
function showTab(t,c,n,btn){let m=data[c][n];if(btn){document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));btn.classList.add('active')}let h='';if(t==='overview')h=`<div class="panel"><div class="title">لماذا يختار العميل هذا الموديل؟</div><div class="talk">${summary(c,n,m)} أهم المميزات: ${m.features.slice(0,3).join('، ')}.</div></div>`;if(t==='specs')h=`<div class="panel"><div class="title">المواصفات الأساسية</div><div class="table">${specs(c,m).map(r=>`<div class="row"><span>${r[0]}</span><b>${r[1]}</b></div>`).join('')}</div></div>`;if(t==='benefits')h=`<div class="panel"><div class="title">من الميزة إلى فائدة العميل</div>${m.features.map((f,i)=>`<div class="benefit"><div class="num">${i+1}</div><div><b>${f}</b><p>${benefit(f)}</p></div></div>`).join('')}</div>`;if(t==='sales')h=`<div class="panel"><div class="title">نص جاهز للعميل</div><div class="talk">${sales(c,n,m)}</div></div>`;if(t==='discovery')h=`<div class="panel"><div class="title">أسئلة اكتشاف الاحتياج</div>${discovery(c).map((q,i)=>`<div class="question"><b>${i+1}.</b> ${q}</div>`).join('')}</div>`;document.getElementById('panel').innerHTML=h}
function backHome(){document.getElementById('detail').classList.remove('open');document.getElementById('compare').classList.remove('open');document.getElementById('catalog').style.display='block';renderList();scrollTo(0,0)}
function text(c,n,m){let base=`Bosch ${n}\n${labels[c]} · Series ${m.series}\n`;if(c==='cooker')base+=`سعة الفرن: 147 لتر\nمدخل الغاز: ${m.gas}\n`;if(c==='dw')base+=`السعة: ${m.people} فرد\nعدد الأرفف: ${m.racks}\n`;if(c==='fridge')base+=`السعة: ${m.capacity} لتر\nالفئة: ${m.kind}\nالأبعاد: ${m.dimensions}\n`;return base+`أهم المميزات:\n- ${m.features.join('\n- ')}\nالضمان: 5 سنوات شامل`}
async function copyModel(c,n){let t=text(c,n,data[c][n]);try{await navigator.clipboard.writeText(t)}catch(e){let x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();document.execCommand('copy');x.remove()}notify('تم نسخ بيانات الموديل')}
function addCompare(c,n){let k=key(c,n);if(compareItems.includes(k)){notify('الموديل موجود بالمقارنة');return}if(compareItems.length===2)compareItems.shift();compareItems.push(k);updateTray();notify('تمت الإضافة للمقارنة')}function updateTray(){document.getElementById('tray').classList.toggle('show',compareItems.length>0);document.getElementById('trayText').textContent=compareItems.length+'/2 للمقارنة'}function clearCompare(){compareItems=[];updateTray()}function openCompare(){if(compareItems.length<2){notify('اختر موديلين للمقارنة');return}let items=compareItems.map(k=>{let [c,n]=k.split('|');return {c,n,m:data[c][n]}}),features=[...new Set(items.flatMap(x=>x.m.features))];document.getElementById('catalog').style.display='none';document.getElementById('detail').classList.remove('open');document.getElementById('compare').innerHTML=`<button class="back" onclick="backHome()">→ رجوع</button><div class="card"><div class="title">مقارنة الموديلات</div><div class="compare-grid">${items.map(x=>`<div class="compare-col"><h3>${x.n}</h3><div class="tick">${labels[x.c]} · Series ${x.m.series}</div>${features.map(f=>`<div class="tick">${x.m.features.includes(f)?'✓':'–'} ${f}</div>`).join('')}</div>`).join('')}</div></div>`;document.getElementById('compare').classList.add('open');scrollTo(0,0)}
buildFilters();renderList();updateTray();</script><script src="pwa-setup.js"></script></body></html>
