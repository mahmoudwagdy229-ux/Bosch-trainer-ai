<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#005691"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Bosch Trainer"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><title>Bosch Home Appliances Trainer</title><style>:root{--r:#e20015;--b:#005691;--c:#008ecf;--bg:#f1f4f5;--ink:#242424;--muted:#687078;--line:#d5dade}*{box-sizing:border-box}body{margin:0;background:#e5e8ea;font-family:Arial,Tahoma,sans-serif;color:var(--ink)}.app{max-width:600px;margin:auto;min-height:100vh;background:var(--bg);padding-bottom:50px}.spectrum{height:8px;background:linear-gradient(90deg,#9b1736,#e20015,#9c258f,#183e8f,#005691,#008ecf,#009b76,#50a83e,#8dbf43)}header{padding:10px 16px;background:#fff;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:8px}.brand img{width:55px;height:55px}.brand b{color:var(--r);font-size:24px}.brand small,.appname small{display:block;font-size:9px}.appname{text-align:left;direction:ltr}main{padding:15px}.hero,.card,.panel{background:#fff;border:1px solid var(--line)}.hero{padding:18px;border-top:6px solid var(--b)}.hero h1{margin:0}.hero p{color:var(--muted);font-size:12px}.search{display:flex;margin-top:12px}.search input{width:100%;padding:14px;border:1px solid #8c969d;font-size:15px}.search button{width:40px;border:0}.cats{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin:12px 0}.cats button,.chip{border:1px solid var(--b);background:#fff;color:var(--b);font-weight:700;padding:11px 5px}.cats button.active,.chip.active{background:var(--b);color:#fff}.filters{display:flex;gap:6px;overflow:auto;padding-bottom:9px}.chip{border-color:#aab1b6;color:#444;white-space:nowrap}.summary{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin:5px}.fav-filter{border:0;background:none;color:var(--b);font-weight:700}.list{display:grid;gap:8px}.product{background:#fff;border:1px solid var(--line);padding:13px;display:grid;grid-template-columns:1fr auto;align-items:center}.over{font-size:10px;color:var(--c);font-weight:800}.model,.hero-model{font-size:22px;font-weight:900;direction:ltr;text-align:right}.desc{font-size:11px;color:var(--muted)}.star{width:38px;height:38px;border:1px solid var(--line);background:#fff;color:#aaa}.star.on{color:#f3a000}.detail{display:none}.detail.open{display:block}.back{border:0;background:none;color:var(--b);font-weight:700;padding:5px}.card,.panel{padding:16px;margin-bottom:10px}.product-hero{border-top:6px solid var(--b)}.eyebrow{font-size:10px;color:var(--b);font-weight:800}.value,.talk{border-right:4px solid var(--r);padding:10px;margin:12px 0;background:#fff7f7;font-size:12px;line-height:1.7}.badges{display:flex;flex-wrap:wrap;gap:5px}.badge{background:#e7f3f8;color:var(--b);padding:5px 7px;font-size:10px}.title{font-weight:800;margin-bottom:10px}.benefit{display:grid;grid-template-columns:34px 1fr;gap:9px;padding:9px 0;border-bottom:1px solid #eee}.num{width:32px;height:32px;display:grid;place-items:center;background:#e7f3f8;color:var(--b);font-weight:900}.benefit p{font-size:11px;color:var(--muted)}.empty{text-align:center;padding:25px;background:#fff}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px;display:none}.toast.show{display:block}</style></head><body><div class="app"><div class="spectrum"></div><header><div class="brand"><img src="icon-192.png" alt="Bosch Home Appliances"><div><b>BOSCH</b><small>Home Appliances</small></div></div><div class="appname"><b>Trainer AI Assistant</b><small>PRODUCT KNOWLEDGE & SALES SUPPORT</small></div></header><main><section id="catalog"><div class="hero"><h1>دليل المنتج الذكي</h1><p>ابحث برقم الموديل أو الميزة، ثم افتح الموديل لعرض نقاط البيع.</p><div class="search"><input id="search" placeholder="ابحث عن أي موديل..." oninput="renderList()"><button id="clear" onclick="clearSearch()">×</button></div></div><div class="cats"><button class="active" data-cat="cooker" onclick="setCategory('cooker')">البوتاجازات</button><button data-cat="dw" onclick="setCategory('dw')">غسالات الأطباق</button><button data-cat="fridge" onclick="setCategory('fridge')">الثلاجات</button><button data-cat="laundry" onclick="setCategory('laundry')">غسالات الملابس</button><button data-cat="homecare" onclick="setCategory('homecare')">المكانس</button><button data-cat="beverage" onclick="setCategory('beverage')">ماكينات القهوة</button><button data-cat="foodprep" onclick="setCategory('foodprep')">تحضير الطعام</button><button data-cat="builtin" onclick="setCategory('builtin')">Built-in</button></div><div id="filters" class="filters"></div><div class="summary"><span><b id="count"></b> موديل</span><button id="favFilter" class="fav-filter" onclick="toggleFavFilter()">☆ المفضلة</button></div><div id="list" class="list"></div></section><section id="detail" class="detail"></section></main><div id="toast" class="toast"></div></div><script src="base-data.js"></script><script src="app.js"></script><script src="expanded-categories.js"></script><script>buildFilters();renderList();</script><script src="image-manager.js"></script><script src="pwa-setup.js"></script></body></html>
