<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bosch Trainer AI Assistant</title><style>
:root{--r:#e20015;--b:#005691;--c:#008ecf;--bg:#f3f5f6;--ink:#252525;--line:#d7dadd}*{box-sizing:border-box}body{margin:0;background:#e7eaec;font-family:Arial,Tahoma,sans-serif;color:var(--ink)}.app{max-width:440px;margin:auto;min-height:100vh;background:var(--bg);padding-bottom:30px}.top{height:8px;background:linear-gradient(90deg,#9b1736,#e20015,#9c258f,#183e8f,#005691,#008ecf,#009b76,#50a83e,#8dbf43)}header{background:white;padding:15px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}.brand b{color:var(--r);font-size:25px}.brand small{display:block;font-size:10px}.wrap{padding:18px}.hero,.card{background:white;border:1px solid var(--line);padding:18px;margin-bottom:14px}.hero{border-top:6px solid var(--b)}h1{font-size:26px;margin:0 0 7px}.muted{color:#666;font-size:13px;line-height:1.7}.category{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0}.category button{padding:14px 8px;border:1px solid var(--b);background:white;color:var(--b);font-weight:700;cursor:pointer}.category button.active{background:var(--b);color:white}.label{font-size:12px;font-weight:700;margin:12px 0 7px}select{width:100%;padding:13px;border:1px solid #999;background:white;font-weight:700}.over{font-size:11px;color:var(--c);font-weight:800}.model{font-size:28px;font-weight:800;direction:ltr;text-align:right;margin:3px 0 12px}.specs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.spec{background:#f1f3f4;border-right:3px solid var(--b);padding:10px}.spec small{display:block;color:#666;font-size:10px}.spec b{font-size:13px}.features{display:grid;gap:8px;margin-top:14px}.feat{padding:11px;border:1px solid var(--line);border-right:4px solid var(--c);font-size:13px}.sales{background:#eef6fa;border-right:4px solid var(--b);padding:13px;line-height:1.8;font-size:13px;margin-top:14px}.copy{width:100%;padding:13px;border:0;background:var(--b);color:white;font-weight:700;cursor:pointer;margin-top:12px}.source{font-size:10px;color:#777;margin-top:12px}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#222;color:white;padding:10px 18px;display:none;z-index:5}.toast.show{display:block}</style></head><body><div class="app"><div class="top"></div><header><div class="brand"><b>BOSCH</b><small>Invented for life</small></div><b>Trainer AI Assistant</b></header><div class="wrap"><div class="hero"><h1>Product Knowledge</h1><div class="muted">اختر فئة المنتج ثم الموديل لعرض أهم المواصفات ونقاط البيع والنص الجاهز للعميل.</div></div><div class="category"><button id="cookerBtn" class="active" onclick="setCategory('cooker')">البوتاجازات</button><button id="dwBtn" onclick="setCategory('dw')">غسالات الأطباق</button></div><div class="label">اختر الموديل</div><select id="modelSelect" onchange="render()"></select><div id="result"></div></div></div><div id="toast" class="toast">تم نسخ النص</div><script>
const cookers={"HJYGGXV60Q": {"series": 8, "gas": "يمين وشمال", "features": ["سعة فرن 147 لتر", "Hybrid Cooking", "تنظيف حفزي", "إذابة المجمدات", "أمان كامل", "رف تلسكوبي"]}, "HJY5G7V61S": {"series": 8, "gas": "يمين وشمال", "features": ["سعة فرن 147 لتر", "Dual Control Wok", "Hybrid Cooking", "تنظيف حفزي", "إذابة المجمدات", "أمان كامل"]}, "HIZ5G7W51S": {"series": 8, "gas": "يمين وشمال", "features": ["سعة فرن 147 لتر", "Dual Control Wok", "Hybrid Cooking", "تنظيف حفزي", "إذابة المجمدات", "أمان كامل"]}, "HGX3G8W50S": {"series": 6, "gas": "يمين وشمال", "features": ["سعة فرن 147 لتر", "إذابة المجمدات", "أمان كامل", "مروحة توزيع ومروحة تبريد"]}, "HGP3I8W50S": {"series": 6, "gas": "يمين فقط", "features": ["سعة فرن 147 لتر", "إذابة المجمدات", "أمان كامل", "مروحة توزيع ومروحة تبريد"]}, "HGV1F8Y52S": {"series": 2, "gas": "يمين فقط", "features": ["سعة فرن 147 لتر", "أمان كامل", "مروحة توزيع ومروحة تبريد"]}, "HGV1F8Y50S": {"series": 2, "gas": "يمين فقط", "features": ["سعة فرن 147 لتر", "أمان كامل", "مروحة توزيع ومروحة تبريد"]}}; const dishwashers={"SMS8YDI82T": {"series": 8, "people": 13, "racks": 3, "features": ["Power Control", "Intelligent Programme", "Zeolith Drying", "Extra Clean Zone", "AquaStop", "Home Connect"]}, "SMS6ECI83T": {"series": 6, "people": 14, "racks": 3, "features": ["Extra Clean Zone", "LED Light", "AquaStop", "Home Connect", "Efficient Dry"]}, "SMS6EMI62V": {"series": 6, "people": 14, "racks": 3, "features": ["Fast Hygiene 72°C", "Efficient Dry", "Self-cleaning Filter", "AquaStop", "Home Connect"]}, "SMP6EMC00V": {"series": 6, "people": 14, "racks": 3, "features": ["Extra Clean Zone", "LED Light", "Self-cleaning Filter", "AquaStop", "Home Connect"]}, "SMS4EMI60V": {"series": 4, "people": 13, "racks": 3, "features": ["Auto Open Dry", "AquaStop", "Rackmatic", "HygienePlus", "Home Connect"]}, "SMS4IKC62T": {"series": 4, "people": 13, "racks": 2, "features": ["Pre-treatment", "Rackmatic", "HygienePlus", "Home Connect"]}, "SMS46NB20V": {"series": 4, "people": 14, "racks": 3, "features": ["AquaStop", "Rackmatic", "HygienePlus", "Extra Dry"]}, "SMS46NI20V": {"series": 4, "people": 14, "racks": 3, "features": ["AquaStop", "Rackmatic", "HygienePlus", "Extra Dry"]}, "SMS46NI01Q": {"series": 4, "people": 13, "racks": 3, "features": ["AquaStop", "Rackmatic", "HygienePlus", "Machine Care"]}, "SMS26AI00V": {"series": 2, "people": 13, "racks": 2, "features": ["Rackmatic", "HygienePlus", "ActiveWater", "DosageAssist"]}, "SMV4IMX62T": {"series": 4, "people": 14, "racks": 3, "features": ["Built-in", "AquaStop", "Home Connect", "Quick 45°"]}, "SMV26DX00T": {"series": 2, "people": 14, "racks": 2, "features": ["Built-in", "Eco 50°", "Pre-Rinse", "Quick 45°", "Quick 65°"]}}; let category='cooker';
function setCategory(c){category=c;document.getElementById('cookerBtn').classList.toggle('active',c==='cooker');document.getElementById('dwBtn').classList.toggle('active',c==='dw');fill()}
function fill(){const d=category==='cooker'?cookers:dishwashers,s=document.getElementById('modelSelect');s.innerHTML=Object.keys(d).map(x=>`<option>${x}</option>`).join('');render()}
function makeText(n,m){if(category==='cooker')return `Bosch ${n}
Series ${m.series}
مدخل الغاز: ${m.gas}
سعة الفرن: 147 لتر
أهم المميزات:
- ${m.features.join('\n- ')}
ضمان شامل 5 سنوات`;return `Bosch ${n}
Series ${m.series}
السعة: ${m.people} فرد
عدد الأرفف: ${m.racks}
المقاس: 60 × 60 × 85 سم
أهم المميزات:
- ${m.features.join('\n- ')}
ضمان 10 سنوات للموتور و5 سنوات شامل`}
function salesText(n,m){if(category==='cooker')return `موديل ${n} من Bosch يوفر فرنًا كبيرًا بسعة 147 لتر، مع ${m.features.slice(0,3).join('، ')}. مناسب للعائلات التي تحتاج مساحة كبيرة ومرونة أثناء الطهي، مع أمان كامل وضمان شامل 5 سنوات.`;return `غسالة الأطباق Bosch ${n} تستوعب ${m.people} فرد وبها ${m.racks} أرفف، وتقدم ${m.features.slice(0,3).join('، ')}. تساعد العميل على الحصول على تنظيف عملي ومرن مع ضمان 10 سنوات للموتور و5 سنوات شامل.`}
function render(){const n=document.getElementById('modelSelect').value,d=category==='cooker'?cookers:dishwashers,m=d[n];if(!m)return;const specs=category==='cooker'?`<div class="spec"><small>مدخل الغاز</small><b>${m.gas}</b></div><div class="spec"><small>سعة الفرن</small><b>147 لتر</b></div>`:`<div class="spec"><small>السعة</small><b>${m.people} فرد</b></div><div class="spec"><small>عدد الأرفف</small><b>${m.racks}</b></div>`;document.getElementById('result').innerHTML=`<div class="card"><div class="over">SERIES ${m.series}</div><div class="model">${n}</div><div class="specs">${specs}</div><div class="features">${m.features.map(f=>`<div class="feat">${f}</div>`).join('')}</div><div class="sales"><b>نص جاهز للعميل</b><br>${salesText(n,m)}</div><button class="copy" onclick="copyText('${n}')">نسخ بيانات الموديل</button><div class="source">المصدر: مواد تدريب EG-FS90 وDishwasher 2026.</div></div>`}
async function copyText(n){const m=(category==='cooker'?cookers:dishwashers)[n],text=makeText(n,m);try{await navigator.clipboard.writeText(text)}catch(e){const t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}const x=document.getElementById('toast');x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1600)}
fill();</script></body></html>
